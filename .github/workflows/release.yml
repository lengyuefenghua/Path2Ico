name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Path2Ico.sln -c Release --nologo

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src/bin/Release/net472/Path2Ico.exe dist/
          Copy-Item src/bin/Release/net472/Path2Ico.exe.config dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "Path2Ico-$tag-windows.zip"

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $escaped = [regex]::Escape($tag)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$escaped\s*$") {
              $start = $i
              break
            }
          }
          $body = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s+') {
                break
              }
              $body += $lines[$i]
            }
          }
          if ($body.Count -eq 0) {
            $body = @("Full Changelog: https://github.com/${{ github.repository }}/commits/$tag")
          }
          Set-Content -Path release-body.md -Value $body -Encoding UTF8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          body_path: release-body.md
          files: Path2Ico-*-windows.zip
          generate_release_notes: false
