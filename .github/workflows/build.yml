name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Path2Ico.sln -c Release --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Path2Ico-net472
          path: src/bin/Release/net472/
          if-no-files-found: error
          retention-days: 14
