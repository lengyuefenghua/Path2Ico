name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Path2Ico.sln -c Release --nologo

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src/bin/Release/net472/Path2Ico.exe dist/
          Copy-Item src/bin/Release/net472/Path2Ico.exe.config dist/
          Copy-Item README.md LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "Path2Ico-$tag-windows.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Path2Ico-*-windows.zip
          generate_release_notes: true
